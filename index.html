<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商城小程序 - 我的订单</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d8d8da;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #111;
      padding: 20px 0;
    }

    .phone {
      width: 375px;
      height: 812px;
      border-radius: 30px;
      overflow: hidden;
      background: #efeff1;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .status {
      height: 46px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 15px;
      font-weight: 700;
      background: #efeff1;
    }

    .topbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      position: relative;
      background: #efeff1;
    }

    .back {
      position: absolute;
      left: 12px;
      border: 0;
      background: transparent;
      font-size: 24px;
      color: #111;
      display: none;
    }

    .content {
      height: calc(100% - 46px - 44px - 74px);
      overflow-y: auto;
      padding: 8px;
      scrollbar-width: none;
    }
    .content::-webkit-scrollbar { display: none; }

    .card {
      background: #fff;
      border-radius: 18px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .profile {
      background: #f17660;
      color: #fff;
      padding: 16px;
      height: 146px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 74px;
      height: 74px;
      border-radius: 12px;
      background: #f2f2f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .profile h2 {
      font-size: 28px;
      margin-bottom: 4px;
      font-weight: 900;
      line-height: 1;
    }

    .profile p {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 700;
    }

    .order-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 12px 6px 10px;
      gap: 6px;
      text-align: center;
      background: #fff;
    }

    .order-shortcut {
      border: 0;
      background: transparent;
      cursor: pointer;
      color: #6b7280;
      position: relative;
      padding: 6px 2px;
      font-size: 12px;
      line-height: 1.2;
    }

    .badge {
      position: absolute;
      right: 18px;
      top: 2px;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      line-height: 16px;
      font-weight: 800;
      padding: 0 4px;
    }

    .ico {
      font-size: 17px;
      margin-bottom: 4px;
      display: block;
      color: #111;
    }

    .menu-item {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 17px;
      font-weight: 700;
      background: #fff;
      border-radius: 18px;
      margin-bottom: 8px;
    }

    .menu-item span:last-child { color: #111; }

    .list-head {
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
    }

    .pill {
      border: 0;
      height: 30px;
      border-radius: 15px;
      padding: 0 12px;
      font-size: 13px;
      background: #f1f3f7;
      color: #606a78;
      font-weight: 700;
      cursor: pointer;
    }

    .pill.active {
      background: #111;
      color: #fff;
    }

    .order-card {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid #eceef2;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #6b7280;
    }

    .order-body {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 9px;
      margin-bottom: 8px;
    }

    .thumb {
      width: 74px;
      height: 74px;
      border-radius: 10px;
      background: linear-gradient(145deg, #f6f6f6, #e2e4e9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .order-title {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 5px;
    }

    .order-sub {
      font-size: 12px;
      color: #7b8493;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .price {
      font-size: 24px;
      color: #111;
      font-weight: 900;
    }

    .state {
      display: inline-flex;
      align-items: center;
      border-radius: 12px;
      border: 1px solid #d5dae3;
      background: #f3f5f8;
      color: #606c7d;
      font-size: 11px;
      height: 24px;
      padding: 0 10px;
      font-weight: 700;
    }

    .detail-card {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .detail-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .kv .k { color: #7b8493; }
    .kv .v { font-weight: 700; word-break: break-all; }

    .divider {
      border-top: 1px dashed #e4e7ed;
      margin: 10px 0;
    }

    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 74px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid #eceff4;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      text-align: center;
    }

    .tab-btn {
      border: 0;
      background: transparent;
      color: #8b919c;
      font-size: 13px;
      font-weight: 700;
    }

    .tab-btn span {
      display: block;
      font-size: 15px;
      margin-bottom: 2px;
    }

    .tab-btn.active { color: #e05f53; }
    .empty-tip {
      text-align: center;
      color: #8891a0;
      padding: 26px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>19:41</span><span>5G 92%</span></div>
    <div class="topbar">
      <button id="backBtn" class="back">‹</button>
      <span id="topTitle">我的</span>
    </div>
    <section id="content" class="content"></section>

    <footer class="tabbar">
      <button class="tab-btn" data-tab="today"><span>📄</span>今日</button>
      <button class="tab-btn" data-tab="shop"><span>🛍️</span>商店</button>
      <button class="tab-btn active" data-tab="mine"><span>👤</span>我的</button>
    </footer>
  </main>

  <script>
    const orders = [
      {
        id: "168514551556394006",
        title: "预售 | Potato Card 电子拍立得土豆片 1 号机",
        desc: "量产计划推进中，按订单顺序陆续发货。",
        price: 399,
        qty: 1,
        status: "待发货",
        payerName: "程驰",
        payerCard: "招商银行 尾号 4932",
        receiver: "大*",
        phone: "150****4441",
        address: "山西省临汾市****元803",
        payTime: "05/28 20:41",
        payNo: "PAY202605282041556394006"
      },
      {
        id: "168514551556394007",
        title: "疯狂星期四 | 小方块 45W 氮化镓折叠快充充电头",
        desc: "小巧便携，支持 PD 快充协议。",
        price: 19.9,
        qty: 2,
        status: "待收货",
        payerName: "林舒",
        payerCard: "中国银行 尾号 2276",
        receiver: "林舒",
        phone: "136****7812",
        address: "浙江省杭州市余杭区文一西路 969号",
        payTime: "05/27 10:18",
        payNo: "PAY202605271018556394007"
      },
      {
        id: "168514551556394008",
        title: "预售 | 原创 AI 电子助理随身卡",
        desc: "支持离线指令，预售中。",
        price: 399,
        qty: 1,
        status: "退款/售后",
        payerName: "安安",
        payerCard: "建设银行 尾号 9021",
        receiver: "安安",
        phone: "139****4408",
        address: "江苏省南京市鼓楼区中山路 188号",
        payTime: "05/25 18:10",
        payNo: "PAY202605251810556394008"
      }
    ];

    let page = "mine";
    let listFilter = "全部订单";
    let currentOrder = null;

    const topTitle = document.getElementById("topTitle");
    const content = document.getElementById("content");
    const backBtn = document.getElementById("backBtn");

    function money(v) {
      return `¥${Number(v).toLocaleString("zh-CN", { minimumFractionDigits: Number(v) % 1 ? 1 : 0, maximumFractionDigits: 2 })}`;
    }

    function renderMine() {
      const pendingShip = orders.filter(o => o.status === "待发货").length;
      const pendingReceive = orders.filter(o => o.status === "待收货").length;
      const refunding = orders.filter(o => o.status === "退款/售后").length;

      content.innerHTML = `
        <section class="card">
          <div class="profile">
            <div class="avatar">🧍</div>
            <div>
              <h2>我的</h2>
              <p>还未登录的新朋友</p>
            </div>
          </div>
          <div class="order-nav">
            <button class="order-shortcut" data-jump="全部订单"><span class="ico">📋</span>全部订单</button>
            <button class="order-shortcut" data-jump="购物袋"><span class="ico">🛒</span>购物袋</button>
            <button class="order-shortcut" data-jump="待收货"><span class="ico">📦</span>待收货${pendingReceive ? `<span class="badge">${pendingReceive}</span>` : ""}</button>
            <button class="order-shortcut" data-jump="退款/售后"><span class="ico">🔎</span>退款/售后${refunding ? `<span class="badge">${refunding}</span>` : ""}</button>
          </div>
        </section>

        <div class="menu-item"><span>我的优惠券</span><span>›</span></div>
        <div class="menu-item"><span>我的地址</span><span>›</span></div>
        <div class="menu-item"><span>联系客服</span><span>›</span></div>
        <div class="menu-item"><span>投诉</span><span>›</span></div>
      `;

      content.querySelectorAll(".order-shortcut").forEach(btn => {
        btn.addEventListener("click", () => {
          const jump = btn.dataset.jump;
          if (jump === "全部订单" || jump === "待收货" || jump === "退款/售后") {
            page = "orders";
            listFilter = jump;
            render();
          }
        });
      });
    }

    function filteredOrders() {
      if (listFilter === "全部订单") return orders;
      if (listFilter === "待收货") return orders.filter(o => o.status === "待收货");
      if (listFilter === "退款/售后") return orders.filter(o => o.status === "退款/售后");
      return orders;
    }

    function renderOrders() {
      const list = filteredOrders();
      const pills = ["全部订单", "待收货", "退款/售后"];

      content.innerHTML = `
        <section class="list-head">
          ${pills.map(p => `<button class="pill ${listFilter === p ? "active" : ""}" data-filter="${p}">${p}</button>`).join("")}
        </section>
        <section id="orderList"></section>
      `;

      const orderList = content.querySelector("#orderList");
      if (!list.length) {
        orderList.innerHTML = `<div class="empty-tip">当前筛选下暂无订单</div>`;
      } else {
        orderList.innerHTML = list.map(o => `
          <article class="order-card" data-id="${o.id}">
            <div class="order-top"><span>订单编号：${o.id}</span><span>${o.status}</span></div>
            <div class="order-body">
              <div class="thumb">🛍️</div>
              <div>
                <div class="order-title">${o.title}</div>
                <div class="order-sub">${o.desc}</div>
                <div class="state">${o.status}</div>
              </div>
            </div>
            <div class="order-top">
              <span>数量 x ${o.qty}</span>
              <span class="price">${money(o.price)}</span>
            </div>
          </article>
        `).join("");

        orderList.querySelectorAll(".order-card").forEach(card => {
          card.addEventListener("click", () => {
            currentOrder = orders.find(o => o.id === card.dataset.id);
            page = "detail";
            render();
          });
        });
      }

      content.querySelectorAll(".pill").forEach(btn => {
        btn.addEventListener("click", () => {
          listFilter = btn.dataset.filter;
          render();
        });
      });
    }

    function renderDetail() {
      if (!currentOrder) {
        page = "orders";
        render();
        return;
      }

      const o = currentOrder;
      const total = o.price * o.qty;

      content.innerHTML = `
        <section class="detail-card">
          <div class="detail-title">收货地址</div>
          <div class="kv"><div class="k">收货人</div><div class="v">${o.receiver} ${o.phone}</div></div>
          <div class="kv"><div class="k">地址</div><div class="v">${o.address}</div></div>
        </section>

        <section class="detail-card">
          <div class="detail-title">订单信息</div>
          <div class="kv"><div class="k">订单编号</div><div class="v">${o.id}</div></div>
          <div class="kv"><div class="k">商品名称</div><div class="v">${o.title}</div></div>
          <div class="kv"><div class="k">订单状态</div><div class="v">${o.status}</div></div>
          <div class="kv"><div class="k">数量</div><div class="v">x ${o.qty}</div></div>
          <div class="divider"></div>
          <div class="kv"><div class="k">商品总价</div><div class="v">${money(total)}</div></div>
          <div class="kv"><div class="k">实付款</div><div class="v" style="color:#e66b5d;">${money(total)}</div></div>
          <div class="kv"><div class="k">付款时间</div><div class="v">${o.payTime}</div></div>
        </section>

        <section class="detail-card">
          <div class="detail-title">付款信息</div>
          <div class="kv"><div class="k">付款人姓名</div><div class="v">${o.payerName}</div></div>
          <div class="kv"><div class="k">付款银行卡</div><div class="v">${o.payerCard}</div></div>
          <div class="kv"><div class="k">支付流水号</div><div class="v">${o.payNo}</div></div>
        </section>
      `;
    }

    function render() {
      backBtn.style.display = page === "mine" ? "none" : "block";
      topTitle.textContent = page === "mine" ? "我的" : page === "orders" ? "订单列表" : "订单详情";

      if (page === "mine") renderMine();
      if (page === "orders") renderOrders();
      if (page === "detail") renderDetail();

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === "mine");
      });
    }

    backBtn.addEventListener("click", () => {
      if (page === "detail") {
        page = "orders";
      } else if (page === "orders") {
        page = "mine";
      }
      render();
    });

    render();
  </script>
</body>
</html>
